<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIU — регламенты компании</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --bg:#18181b; --bg2:#1f1f23; --bg3:#26262b; --line:#33333a; --text:#e6e6ea; --muted:#9a9aa5; --dim:#6b6b75;
  --accent:#a78bfa;
  --c-company:#f5c542; --c-dept:#a78bfa; --c-role:#38bdf8; --c-reg:#4ade80; --c-ref:#f472b6; --c-general:#fb923c; --c-lock:#71717a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:270px 1fr 440px;height:100vh;overflow:hidden}
/* left */
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
.search input:focus{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;user-select:none}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.off{opacity:.35}
.tree{overflow:auto;padding:8px 6px 20px;flex:1}
.tree .grp{margin:6px 0}
.tree .gt{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);padding:8px 10px 4px}
.tree .it{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--text);font-size:13px;line-height:1.3}
.tree .it:hover{background:var(--bg3)}
.tree .it.active{background:#2e2a45;color:#fff}
.tree .it i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.tree .it.l2{padding-left:24px;color:#cfcfd6}
.tree .it.l3{padding-left:38px;color:var(--muted);font-size:12.5px}
.tree .it.hide{display:none}
/* graph */
.graph{position:relative;min-width:0}
.graph svg{width:100%;height:100%;display:block;cursor:grab}
.graph svg:active{cursor:grabbing}
.toolbar{position:absolute;left:14px;top:12px;display:flex;gap:6px;z-index:2}
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.hint{position:absolute;left:14px;bottom:12px;color:var(--dim);font-size:12px;pointer-events:none}
.node text{fill:#d4d4dc;font-size:11px;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.link{stroke:#4a4a55;stroke-opacity:.55}
.link.x{stroke-dasharray:3 3;stroke-opacity:.35}
.faded{opacity:.12}
/* note */
.note{background:var(--bg2);border-left:1px solid var(--line);overflow:auto;min-height:0}
.note .inner{padding:22px 24px 40px}
.crumbs{font-size:12px;color:var(--dim);margin-bottom:8px}
.crumbs span{cursor:pointer}
.crumbs span:hover{color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.badge i{width:8px;height:8px;border-radius:50%}
.note h2{margin:0 0 12px;font-size:21px;line-height:1.25}
.note h3{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.note p{line-height:1.6;margin:0 0 10px;color:#d8d8de}
.note ul,.note ol{margin:0 0 10px;padding-left:20px;line-height:1.6;color:#d8d8de}
.note li{margin:3px 0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 4px}
.meta dt{color:var(--muted);font-size:12.5px}
.meta dd{margin:0;font-size:13px}
.tbl{width:100%;border-collapse:collapse;margin:4px 0 12px;font-size:12.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;line-height:1.45}
.tbl th{color:var(--muted);font-weight:600}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#3a2f12;color:#f5c542;border:1px solid #5b4a1a}
.pill.ok{background:#12301f;color:#4ade80;border-color:#1f5236}
.pill.vac{background:#3a1720;color:#fb7185;border-color:#5b2230}
.warn{background:#2b2316;border:1px solid #5b4a1a;border-radius:10px;padding:10px 12px;color:#f3d9a4;margin:8px 0 12px;line-height:1.5}
.lock{background:#232327;border:1px dashed #55555f;border-radius:10px;padding:14px;color:var(--muted);line-height:1.55}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel span{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.rel span:hover{border-color:var(--accent)}
.rel span i{width:7px;height:7px;border-radius:50%}
.tpl{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.55;font-size:13px;margin:0 0 6px;color:#e2e2e8}
.copy{font-size:11.5px;margin:0 0 12px}
.week{display:grid;gap:8px}
.day{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.day > b{display:block;margin-bottom:4px}
.day ul{margin:0}
.mobtabs{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:240px 1fr}
  .note{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);transform:translateX(100%);transition:transform .2s;z-index:10;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
  .note.open{transform:none}
  .closeNote{display:inline-block!important}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:85%;max-width:320px;transform:translateX(-100%);transition:transform .2s;z-index:11}
  .side.open{transform:none}
  .menuBtn{display:inline-block!important}
}
.closeNote,.menuBtn{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><h1>ALIU · Регламенты</h1><p>Структура компании от владельца до исполнителя</p></div>
    <div class="search"><input id="q" placeholder="Поиск: чулки, КИЗ, Ozon, отзывы…" autocomplete="off"></div>
    <div class="legend" id="legend"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="graph" id="graphWrap">
    <div class="toolbar">
      <button class="btn menuBtn" id="menuBtn">☰ Разделы</button>
      <button class="btn" id="fitBtn">Показать всё</button>
      <button class="btn" id="homeBtn">ALIU</button>
    </div>
    <svg id="svg"></svg>
    <div class="hint">Колесо — масштаб · тяни фон — двигать · клик по узлу — открыть</div>
  </main>
  <section class="note" id="note"><div class="inner" id="noteInner"></div></section>
</div>

<script>
// ============ ДАННЫЕ ============
const TYPES = {
  company:{label:'Компания', color:'var(--c-company)', hex:'#f5c542', r:20},
  dept:{label:'Отдел', color:'var(--c-dept)', hex:'#a78bfa', r:13},
  role:{label:'Сотрудник / роль', color:'var(--c-role)', hex:'#38bdf8', r:9},
  reg:{label:'Регламент', color:'var(--c-reg)', hex:'#4ade80', r:6.5},
  general:{label:'Общие правила', color:'var(--c-general)', hex:'#fb923c', r:8},
  ref:{label:'Справочник', color:'var(--c-ref)', hex:'#f472b6', r:6},
  lock:{label:'Закрыто', color:'var(--c-lock)', hex:'#71717a', r:6}
};

const U = '<span class="pill">уточняется</span>';
const VAC = '<span class="pill vac">вакансия</span>';
const OK = '<span class="pill ok">актуально</span>';

function meta(o){return '<dl class="meta">'+Object.entries(o).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>'}
function sec(t,h){return `<h3>${t}</h3>${h}`}
function ol(a){return '<ol>'+a.map(x=>`<li>${x}</li>`).join('')+'</ol>'}
function ul(a){return '<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>'}
function tbl(head,rows){return '<table class="tbl"><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table>'}
function tpl(t){return `<div class="tpl">${t}</div><div class="copy"><button class="btn" onclick="copyTpl(this)">Скопировать</button></div>`}
function person(o){
  return meta({
    'Сотрудник':o.name, 'Должность':o.pos, 'Отдел':o.dept, 'Руководитель':o.boss,
    'Город':o.city, 'Часовой пояс':o.tz, 'График':o.hours, 'Формат':o.fmt
  });
}

const N = []; const L = [];
function node(id,type,title,parent,body,extra={}){N.push(Object.assign({id,type,title,parent,body},extra)); if(parent) L.push({source:parent,target:id,kind:'tree'});}
function x(a,b){L.push({source:a,target:b,kind:'x'})}

// ---------- Компания ----------
node('aliu','company','ALIU',null,
  meta({'Бренд':'ALIU','Каналы продаж':'Ozon (основной), Wildberries','Ассортимент':'Пояса для чулок, чулки 20 и 40 ден, комплекты пояс + чулки, боди; новинка — медицинские костюмы','Производство':'Своё производство в России + закупка (Китай, Киргизия)','Офис и склад':'Казань '+U,'Часовой пояс':'МСК (UTC+3)'})+
  sec('Как пользоваться порталом', ul(['Найдите свой <b>отдел</b> (фиолетовые узлы) или свою <b>должность</b> (голубые).','Зелёные узлы — <b>регламенты</b>: что, когда и как делать.','Оранжевые — <b>общие правила</b> для всех: неделя компании, спринты, чаты, оплата счетов.','Розовые — <b>справочники</b>: ассортимент, сроки, глоссарий.','Серые с замком — закрытый раздел, доступ у руководства.']))+
  sec('Структура подчинения', ul(['Владелец → Коммерческий директор','Коммерческий директор → Продажи, Операционный отдел, Производство и склад, Финансы']))+
  '<div class="warn">Черновик v0.1 от 19.11.2026. Поля с пометкой «уточняется» будут заполнены после сверки состава команды.</div>'
);

node('owner','role','Владелец — Рушан Ракипов','aliu',
  person({name:'Рушан Ракипов',pos:'Владелец (CEO)',dept:'Руководство',boss:'—',city:'Казань',tz:'МСК',hours:U,fmt:U})+
  sec('Зона ответственности', ul(['Стратегия и собственность бизнеса','Передаёт операционное управление коммерческому директору']))
);
node('kd','role','Коммерческий директор — Айнур Вахитов','owner',
  person({name:'Айнур Вахитов',pos:'Коммерческий директор',dept:'Руководство',boss:'Рушан Ракипов',city:U,tz:'МСК',hours:'Пн–пт',fmt:U})+
  sec('Зона ответственности', ul(['Полное операционное управление и рост компании','Продажи WB и Ozon, планы продаж, юнит-экономика','Еженедельный разбор метрик по отзывам, лимиты компенсаций','Утверждение закупок вместе с финансистом','Еженедельный отчёт владельцу по закрытым задачам']))
);

// ---------- Отделы ----------
node('d_sales','dept','Отдел продаж','kd',
  sec('Задача отдела', p('Выполнять план продаж на WB и Ozon: карточки, реклама, поставки на склады маркетплейсов, отзывы, ТЗ на производство.'))+
  sec('Ключевые сроки', ul(['<b>Пн до 14:00</b> — ТЗ на поставки текущей недели','<b>Вт до 14:00</b> — ТЗ на поставки следующей недели','<b>До 25-го</b> — ТЗ на месяц + предзаказ на следующий','<b>24 часа</b> — ответ на отзыв 1–3★']))
);
node('d_ops','dept','Операционный отдел','kd',
  sec('Задача отдела', p('Обеспечить, чтобы товар был закуплен, промаркирован, собран и вовремя уехал на маркетплейсы. Ведёт снабжение, Честный знак, ФБС, логистику, оплаты.'))
);
node('d_prod','dept','Производство и склад','kd',
  sec('Задача отдела', p('Отшить и собрать товар по ТЗ отдела продаж в срок и в нужном качестве. Склад (ФФ) в Казани собирает поставки.'))
);
node('d_fin','dept','Финансы (аутсорс)','kd',
  sec('Задача отдела', p('Финансовый контроль, согласование крупных закупок, бухгалтерия и отчётность.'))
);

function p(t){return `<p>${t}</p>`}

// ---------- Роли ----------
node('r_wb','role','Менеджер WB','d_sales',
  person({name:'Кристина '+U,pos:'Менеджер Wildberries',dept:'Отдел продаж',boss:'Коммерческий директор',city:U,tz:U,hours:U,fmt:'Удалённо'})+
  sec('Зона ответственности', ul(['План продаж и реклама кабинета WB','Еженедельное ТЗ на поставки WB и ТЗ ВБ FBS','ТЗ на производство и предзаказ (часть WB)','Ответы на негативные отзывы WB','Сверка: сколько собрано по ТЗ ФБС (получает в пятницу)']))
);
node('r_ozon','role','Менеджер Ozon','d_sales',
  person({name:'Наталья',pos:'Менеджер Ozon',dept:'Отдел продаж',boss:'Коммерческий директор',city:U,tz:U,hours:U,fmt:'Удалённо'})+
  sec('Зона ответственности', ul(['План продаж и реклама кабинета Ozon','Еженедельное ТЗ на поставки Ozon (кластеры)','ТЗ на производство и предзаказ (часть Ozon)','Ответы на негативные отзывы Ozon','Возвраты Ozon → чат «Возвраты Озон»']))
);
node('r_launch','role','Менеджер по запуску новинок','d_sales',
  person({name:U,pos:'Менеджер по запуску новых товаров',dept:'Отдел продаж',boss:'Коммерческий директор',city:U,tz:U,hours:U,fmt:U})+
  sec('Зона ответственности', ul(['Карточки, контент и ценообразование новинок','План запуска: от образца до начала продаж','Первые отзывы и тест']))
);
node('r_content','role','Контент и фото','d_sales',
  person({name:'Лера '+U,pos:'Фотограф / контент',dept:'Отдел продаж',boss:'Коммерческий директор',city:U,tz:U,hours:U,fmt:U})+
  sec('Зона ответственности', ul(['Планирование фотосетов, подготовка фото для карточек','Чат «Контент»']))
);
node('r_assist','role','Бизнес-ассистент — Аделя','d_ops',
  person({name:'Аделя',pos:'Бизнес-ассистент',dept:'Операционный отдел',boss:'Коммерческий директор',city:'Казань',tz:'МСК',hours:U,fmt:U})+
  sec('Зона ответственности', ul(['Оплата счетов, учёт расходов','Зарплата официальным сотрудникам','Аренда в СБИС','Планы запусков новинок, автоматизация таблиц']))
);
node('r_supply','role','Менеджер по снабжению','d_ops',
  person({name:U,pos:'Менеджер по снабжению',dept:'Операционный отдел',boss:'Коммерческий директор',city:'Казань',tz:'МСК',hours:'Пн–пт',fmt:'Офис'})+
  sec('Зона ответственности', ul(['ФБС: сборка, поставки, учёт','Честный знак: ввод в оборот, вывод из оборота, УПД','Заказ чулок, фурнитуры, работа с Китаем','Логистика: забор груза, водители, поставки до СЦ','Выкупы с возвратом на склад']))+
  sec('Задачи и время', tbl(['Задача','Когда','Время'],[
    ['Сборка ФБС, учёт отгрузок','каждый день','30–60 мин'],
    ['Вывод из оборота проданных по ФБС','каждый день','15 мин'],
    ['Честный знак: заказ кодов, ввод в оборот','понедельник + срочные','4–5 ч'],
    ['УПД WB (FBO)','понедельник','10–15 мин'],
    ['Заказ чулок','вторник','60–90 мин'],
    ['Заявка на забор груза WB (МП Логистик)','среда','10–15 мин'],
    ['Забор груза Ozon, данные водителя менеджеру Ozon','четверг','5 мин'],
    ['Фурнитура для образцов и товаров','по задаче','1–2 ч'],
    ['Поиск поставщиков','по ситуации','—']
  ]))
);
node('r_prodhead','role','Руководитель производства','d_prod',
  person({name:VAC+' (передача от Алии)',pos:'Руководитель производства',dept:'Производство и склад',boss:'Коммерческий директор',city:'Казань / Старое Дрожжаное',tz:'МСК',hours:U,fmt:'Офис / цех'})+
  sec('Зона ответственности', ul(['Приём ТЗ на производство, планирование загрузки','Крой (2 раза в месяц), лекала, градация','Поиск и работа со швеями','Контроль упаковки и передачи поставок','Пересчёт себестоимости в начале месяца','Учёт возвратов в таблице производства (вт, пт)','Разбор брака по отзывам (ОТК)']))
);
node('r_ff','role','Склад / ФФ Казань — Елена','d_prod',
  person({name:'Елена '+U,pos:'Сборка поставок (ФФ)',dept:'Производство и склад',boss:'Руководитель производства',city:'Казань',tz:'МСК',hours:U,fmt:'Офис / склад'})+
  sec('Зона ответственности', ul(['Сборка поставок WB и Ozon по ТЗ на сборку','Упаковка, маркировка коробов','Заполняет столбец «Короб» в ТЗ']))
);
node('r_financier','role','Финансист','d_fin',
  person({name:U,pos:'Финансист (аутсорс)',dept:'Финансы',boss:'Коммерческий директор',city:'Казань',tz:'МСК',hours:U,fmt:'Аутсорс'})+
  sec('Зона ответственности', ul(['Согласование закупок со скидкой за объём, предоплатой, долгосрочными контрактами','Финансовые вопросы WB']))
);
node('r_account','role','Бухгалтер — Татьяна','d_fin',
  person({name:'Татьяна',pos:'Бухгалтер (аутсорс)',dept:'Финансы',boss:'Коммерческий директор',city:'Казань / Набережные Челны',tz:'МСК',hours:U,fmt:'Аутсорс'})
);

// ---------- Общие правила ----------
node('g_week','general','Неделя компании','aliu',
  p('Сквозной график: кто и к какому часу передаёт результат. Все время — МСК.')+
  '<div class="week">'+

x('reg_assist','g_pay');

// ---------- Регламенты: Производство ----------
node('reg_prodplan','reg','План производства','r_prodhead',
  meta({'Где':'Таблица «Поставки», лист «План производства»','Результат':'Колонка F «Требуемое к производству», итог в G2'})+
  sec('Шаги', ol(['Обновить исходные данные: отчёты WB и Ozon, остатки.','В ячейке B2 указать период планирования в днях (например, 35).','Проверить колонку F: план минус остаток, но не меньше нуля.','Передать в производство строки, где F больше 0.']))+
  sec('Колонки', tbl(['Колонка','Значение'],[['B — WB в день','Средние продажи за 7 дней из «Отчет_вб»'],['C — Ozon в день','Средние продажи за 28 дней'],['D — План','Потребность на период с учётом сроков и запаса'],['E — Остатки','Из таблицы «Производство», лист «Остатки»'],['F — К производству','План − остаток, не меньше 0'],['J–R — Пошив','Цех, выработка 1 и 4 человек в день, дни пошива, упаковки, фурнитуры, кроя, итого дней']]))
);
x('reg_prodplan','reg_tz_month');

// ---------- Закрытые связи ----------
x('lock_buy','r_wb'); x('lock_buy','r_ozon'); x('lock_buy','r_supply');
x('reg_stock','reg_tz_wb'); x('reg_kiz_in','reg_logistics'); x('reg_fbs_form','reg_fbs_pack'); x('reg_kiz_out','reg_fbs_form');
x('reg_tz_wb','r_ff'); x('reg_tz_ozon','r_ff'); x('g_week','reg_supply_week'); x('g_sprint','kd');
x('reg_launch','reg_tz_month');

// ============ ГРАФ ============
const byId = Object.fromEntries(N.map(n=>[n.id,n]));
const neighbors = {}; N.forEach(n=>neighbors[n.id]=new Set());
L.forEach(l=>{neighbors[l.source].add(l.target); neighbors[l.target].add(l.source)});
N.forEach(n=>n.deg=neighbors[n.id].size);

const svg = d3.select('#svg');
const wrap = document.getElementById('graphWrap');
let W = wrap.clientWidth, H = wrap.clientHeight;
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.2,4]).on('zoom',e=>{g.attr('transform',e.transform); updateLabels(e.transform.k)});
svg.call(zoom);

const links = L.map(l=>({...l}));
const nodes = N.map(n=>({...n}));
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id).distance(l=>l.kind==='x'?140:(byId[l.target.id||l.target].type==='reg'?65:105)).strength(l=>l.kind==='x'?0.04:0.6))
  .force('charge', d3.forceManyBody().strength(d=>-60-TYPES[d.type].r*14))
  .force('center', d3.forceCenter(W/2,H/2))
  .force('collide', d3.forceCollide().radius(d=>TYPES[d.type].r+6));

const link = g.append('g').selectAll('line').data(links).join('line').attr('class',d=>'link'+(d.kind==='x'?' x':'')).attr('stroke-width',d=>d.kind==='x'?0.8:1.2);
const nodeG = g.append('g').selectAll('g').data(nodes).join('g').attr('class','node').style('cursor','pointer')
  .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
nodeG.append('circle').attr('r',d=>TYPES[d.type].r+Math.min(d.deg,8)*0.35).attr('fill',d=>TYPES[d.type].hex).attr('stroke',d=>d.type==='lock'?'#a1a1aa':'none').attr('stroke-dasharray','2 2');
nodeG.append('text').attr('dy',d=>TYPES[d.type].r+14).attr('text-anchor','middle').text(d=>d.title.length>34?d.title.slice(0,32)+'…':d.title);

nodeG.on('mouseenter',(e,d)=>highlight(d.id)).on('mouseleave',()=>highlight(currentId)).on('click',(e,d)=>{e.stopPropagation(); open(d.id)});
svg.on('click',()=>{});

sim.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  nodeG.attr('transform',d=>`translate(${d.x},${d.y})`);
});

function updateLabels(k){
  nodeG.select('text').style('display',d=>(k>1.25||['company','dept','role','general'].includes(d.type))?null:'none');
}
let hiddenTypes = new Set();
function highlight(id){
  if(!id){nodeG.classed('faded',d=>hiddenTypes.has(d.type)); link.classed('faded',d=>hiddenTypes.has(d.source.type)||hiddenTypes.has(d.target.type)); return}
  const nb = neighbors[id];
  nodeG.classed('faded',d=>hiddenTypes.has(d.type)||!(d.id===id||nb.has(d.id)));
  link.classed('faded',d=>!(d.source.id===id||d.target.id===id));
}
function fit(){
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const x0=Math.min(...xs)-60,x1=Math.max(...xs)+60,y0=Math.min(...ys)-60,y1=Math.max(...ys)+60;
  W=wrap.clientWidth; H=wrap.clientHeight;
  const k=Math.min(W/(x1-x0),H/(y1-y0),1.4);
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k));
}
function focusNode(id){
  const n=nodes.find(n=>n.id===id); if(!n||n.x==null)return;
  const t=d3.zoomTransform(svg.node()); const k=Math.max(t.k,1.1);
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(wrap.clientWidth/2-k*n.x,wrap.clientHeight/2-k*n.y).scale(k));
}
setTimeout(()=>{fit(); if(currentId==='aliu') highlight(null)},1800);
document.getElementById('fitBtn').onclick=()=>{highlight(null);fit()};
document.getElementById('homeBtn').onclick=()=>open('aliu');
window.addEventListener('resize',()=>{W=wrap.clientWidth;H=wrap.clientHeight;sim.force('center',d3.forceCenter(W/2,H/2)).alpha(.2).restart()});

// ============ ЛЕГЕНДА / ДЕРЕВО ============
const legend=document.getElementById('legend');
Object.entries(TYPES).forEach(([k,t])=>{
  const c=document.createElement('span'); c.className='chip'; c.innerHTML=`<i style="background:${t.hex}"></i>${t.label}`;
  c.onclick=()=>{hiddenTypes.has(k)?hiddenTypes.delete(k):hiddenTypes.add(k); c.classList.toggle('off'); highlight(currentId)};
  legend.appendChild(c);
});

const tree=document.getElementById('tree');
function item(n,lvl){return `<div class="it l${lvl}" data-id="${n.id}" data-s="${(n.title+' '+(n.body||'').replace(/<[^>]+>/g,' ')).toLowerCase()}"><i style="background:${TYPES[n.type].hex}"></i>${n.title}</div>`}
function kids(id,type){return N.filter(n=>n.parent===id&&(!type||n.type===type))}
let html='';
html+='<div class="grp"><div class="gt">Руководство</div>'+item(byId.aliu,1)+item(byId.owner,2)+item(byId.kd,2)+'</div>';
['d_sales','d_ops','d_prod','d_fin'].forEach(d=>{
  html+=`<div class="grp"><div class="gt">${byId[d].title}</div>`+item(byId[d],1);
  kids(d,'reg').forEach(r=>html+=item(r,2));
  kids(d,'role').forEach(r=>{html+=item(r,2); kids(r.id).forEach(c=>html+=item(c,3));});
  html+='</div>';
});
html+='<div class="grp"><div class="gt">Общие правила</div>'+N.filter(n=>n.type==='general').map(n=>item(n,1)).join('')+'</div>';
html+='<div class="grp"><div class="gt">Справочники</div>'+N.filter(n=>n.type==='ref').map(n=>item(n,1)).join('')+'</div>';
html+='<div class="grp"><div class="gt">Закрытый раздел</div>'+N.filter(n=>n.type==='lock').map(n=>item(n,n.parent==='lock'?2:1)).join('')+'</div>';
tree.innerHTML=html;
tree.addEventListener('click',e=>{const it=e.target.closest('.it'); if(it){open(it.dataset.id); focusNode(it.dataset.id); document.getElementById('side').classList.remove('open')}});

document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  tree.querySelectorAll('.it').forEach(it=>it.classList.toggle('hide',q&&!it.dataset.s.includes(q)));
  if(!q){highlight(currentId);return}
  const hit=new Set(N.filter(n=>(n.title+' '+(n.body||'').replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)).map(n=>n.id));
  nodeG.classed('faded',d=>!hit.has(d.id)); link.classed('faded',true);
});
document.getElementById('menuBtn').onclick=()=>document.getElementById('side').classList.toggle('open');

// ============ КАРТОЧКА ============
let currentId=null;
function chain(id){const a=[];let n=byId[id];while(n){a.unshift(n);n=byId[n.parent]}return a}
function open(id){
  const n=byId[id]; if(!n)return; currentId=id;
  const crumbs=chain(id).slice(0,-1).map(c=>`<span data-go="${c.id}">${c.title}</span>`).join(' / ');
  const rel=[...neighbors[id]].map(r=>byId[r]).filter(r=>r.id!==n.parent).sort((a,b)=>Object.keys(TYPES).indexOf(a.type)-Object.keys(TYPES).indexOf(b.type));
  document.getElementById('noteInner').innerHTML=
    `<button class="btn closeNote" onclick="document.getElementById('note').classList.remove('open')" style="float:right">✕</button>`+
    (crumbs?`<div class="crumbs">${crumbs}</div>`:'')+
    `<div class="badge"><i style="background:${TYPES[n.type].hex}"></i>${TYPES[n.type].label}</div><h2>${n.title}</h2>`+
    (n.body||'')+
    (rel.length?sec('Связано',`<div class="rel">${rel.map(r=>`<span data-go="${r.id}"><i style="background:${TYPES[r.type].hex}"></i>${r.title}</span>`).join('')}</div>`):'');
  document.getElementById('note').scrollTop=0;
  document.getElementById('note').classList.add('open');
  tree.querySelectorAll('.it').forEach(it=>it.classList.toggle('active',it.dataset.id===id));
  highlight(id);
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
}
document.getElementById('noteInner').addEventListener('click',e=>{const g=e.target.closest('[data-go]'); if(g){open(g.dataset.go); focusNode(g.dataset.go)}});
function copyTpl(b){const t=b.parentElement.previousElementSibling.innerText; navigator.clipboard.writeText(t).then(()=>{b.textContent='Скопировано'; setTimeout(()=>b.textContent='Скопировать',1500)}).catch(()=>{b.textContent='Выделите текст вручную'})}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1); if(byId[id]&&id!==currentId){open(id);focusNode(id)}});
open(byId[location.hash.slice(1)]?location.hash.slice(1):'aliu');
updateLabels(1);
</script>
</body>
</html>
